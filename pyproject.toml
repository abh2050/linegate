[project]
name = "linegate"
version = "0.1.0"
description = "Bosch line failure prediction, dollar-priced decisions, human review of the uncertain band."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "kaggle>=1.6",
    "lightgbm>=4.5",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linegate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
