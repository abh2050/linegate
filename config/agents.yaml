provider: openai                          # ADR-0004: no Anthropic key available
model: gpt-5.4-mini
usd_per_million_input_tokens: 0.75        # assumption: verify against current OpenAI pricing
usd_per_million_output_tokens: 4.50       # assumption: verify against current OpenAI pricing
hypothesis:
  model: gpt-5.4                        # stronger model for search; the warden keeps the default model
  usd_per_million_input_tokens: 2.50    # assumption: verify against current OpenAI pricing
  usd_per_million_output_tokens: 15.00  # assumption: verify against current OpenAI pricing
  max_evaluate_calls: 40
  max_usd: 8.00
  stop_after_failed_proposals: 3
  min_delta_mcc: 0.004                  # floor; the measured noise bar usually dominates (ADR-0006)
  placebo_runs: 4                       # random-column controls that measure evaluate noise
  noise_sd_multiplier: 2.0              # acceptance needs MCC and AP gains beyond this many placebo SDs
  max_nudges: 5                         # times the runtime asks an agent that stops early to continue
warden:
  id_shuffle_collapse_threshold: 0.60   # lift loss that triggers quarantine
  strict_split_min_retention: 0.50
  min_lift: 0.02                        # ~2 standard errors of AUC at ~1,000 positives; below this, collapse and retention are noise
  row_scope_sample_fraction: 0.5
  max_usd: 1.00                         # per feature review
  max_turns: 8
disposition:
  neighbors_k: 20
  citation_validation: strict
